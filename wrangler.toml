# Unified Cloudflare Workers configuration for this repository
# This file was generated by the cleanup script and merges the previous
# worker/wrangler.toml and wrangler.jsonc files. Replace placeholders
# (YOUR_ACCOUNT_ID, YOUR_ZONE_ID) with real values or set them as
# environment variables before deploying.

name = "gra"
main = "worker/dist/worker.js"
type = "javascript"
compatibility_date = "2025-11-11"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[build]
# Build command uses the worker package's build script (esbuild)
command = "npm --prefix ./worker run build"

[build.upload]
# The worker's build script writes the bundle to worker/dist
dir = "./worker/dist"

[site]
# Static assets (publicly served) for the worker
bucket = "./worker/public"

[vars]
ENVIRONMENT = "development"

[env.production]
vars = { ENVIRONMENT = "production" }